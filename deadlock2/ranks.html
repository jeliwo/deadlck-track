<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Ranks · Deadlock Tracker
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet"/>

 </head>
 <body>
  <aside class="sidebar" id="sidebar">
  </aside>
  <script src="data.js">

   <h1 class="page-title">
    Ranks
   </h1>
   <p class="sub">

      <th>

        <img class="rank-badge" src="img/Rank_Obscurus_Badge.png" alt="" loading="lazy">
        <span class="rank-name">Obscurus <small>(unranked)</small></span>
       </div>
      </td>
      <td class="players">--</td>
     </tr>
